# =====================================================================
#  config.cfg - konfiguracja glowna buildera JellyFin-Tizen (v2)
#  Format: KLUCZ=WARTOSC (bez spacji wokol znaku "=", bez cudzyslowow,
#  bez spacji na koncu linii). Linie zaczynajace sie od # sa ignorowane.
# =====================================================================

# --- WYMAGANE ---

# Katalog glowny Tizen Studio
TIZEN_STUDIO=C:\tizen-studio

# Katalog, w ktorym maja ladowac skompilowane pliki .wgt
OUTPUT_DIR=C:\wgt-releases

# --- OPCJONALNE (odkomentuj, aby nadpisac wartosci domyslne) ---

# Katalog roboczy na zrodla (domyslnie: <katalog skryptu>\work).
# Uwaga: przechowywany jest w nim rowniez cache zbudowanego jellyfin-web
# (work\jellyfin-web\dist) - rekompilacja nastepuje tylko przy zmianie wersji.
#WORK_DIR=

# Repozytorium klienta jellyfin-tizen i galaz/tag do zbudowania.
# Domyslnie: oficjalne repo i galaz master. Aby zbudowac konkretne
# oficjalne wydanie, podaj jego tag, np. JELLYFIN_TIZEN_REF=2.0.0
#JELLYFIN_TIZEN_REPO=https://github.com/jellyfin/jellyfin-tizen.git
#JELLYFIN_TIZEN_REF=master

# Wersja interfejsu jellyfin-web = tag z repozytorium jellyfin-web,
# np. v10.10.7. Puste = automatycznie najnowszy stabilny tag vX.Y.Z.
# (jellyfin-web jest klonowany i budowany ze zrodel przez skrypt)
JELLYFIN_WEB_VERSION=master
#JELLYFIN_WEB_REPO=https://github.com/jellyfin/jellyfin-web.git

# REBUILD_WEB=1 - wymus pelna przebudowe jellyfin-web mimo cache
# (przydatne np. gdy JELLYFIN_WEB_VERSION=master i chcesz swiezy build)
#REBUILD_WEB=0

# Profil podpisywania i certyfikat (tworzone automatycznie przy pierwszym
# uruchomieniu). Jesli masz juz profil z wczesniejszych budowan, wpisz jego
# nazwe, np. CERT_PROFILE=JellyfinProfile
#CERT_PROFILE=jellyfinmod
#CERT_ALIAS=jellyfinmod
#CERT_PASSWORD=jellyfin123

# Katalog tizen-studio-data - ustaw tylko, jesli skrypt sam go nie znajdzie
#TIZEN_DATA=

# KEEP_SOURCES=1 - nie usuwaj zrodel jellyfin-tizen przed kolejnym buildem
# (szybciej); 0 = kazdy build ze swiezego klonu (domyslnie, najbardziej
# niezawodne). Nie dotyczy jellyfin-web, ktory ma wlasny cache.
#KEEP_SOURCES=0

# Prefiks nazwy wynikowego pliku .wgt (do nazwy dodawany jest znacznik czasu)
#WGT_NAME_PREFIX=Jellyfin-mod

# URL instalatora Tizen Studio CLI - uzywany tylko, gdy Tizen Studio nie jest
# zainstalowane pod sciezka TIZEN_STUDIO
#TIZEN_CLI_URL=https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_windows-64.exe
